<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultório - Novo Usuário</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
        }

        header {
            background: #1a3a5c;
            color: white;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 20px;
            font-weight: 700;
        }

        header span {
            font-size: 14px;
            color: #93c5fd;
        }

        .container {
            max-width: 860px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .page-title {
            font-size: 26px;
            font-weight: 700;
            color: #1a3a5c;
            margin-bottom: 24px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 28px 24px;
        }

        .form-row {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 150px;
        }

        .form-group.full {
            flex: 1 1 100%;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            padding: 9px 12px;
            border: 1.5px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
            color: #111827;
            outline: none;
            transition: border-color 0.2s;
            background: white;
            width: 100%;
        }

        input:focus, select:focus {
            border-color: #1a3a5c;
        }

        input::placeholder {
            color: #9ca3af;
        }

        .form-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 8px;
        }

        .btn {
            padding: 9px 22px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-enviar {
            background: #1a3a5c;
            color: white;
        }

        .btn-enviar:hover {
            background: #14305a;
        }

        .btn-cancelar {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-cancelar:hover {
            background: #d1d5db;
        }
    </style>
</head>
<body>
    <header>
        <h1>🏥 Consultório</h1>
        <span>Cadastro de Usuário</span>
    </header>

    <div class="container">
        <h2 class="page-title">Novo Usuário</h2>

        <div class="card">

            <div class="form-row">
                <div class="form-group full">
                    <label>Nome:</label>
                    <input type="text" id="nome" placeholder="Informe o nome..." />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>CPF:</label>
                    <input type="text" id="cpf" placeholder="Informe o cpf..." />
                </div>
                <div class="form-group" style="flex: 2;">
                    <label>Endereço:</label>
                    <input type="text" id="endereco" placeholder="Informe o endereço..." />
                </div>
                <div class="form-group">
                    <label>Nível:</label>
                    <select id="nivel">
                        <option value="">---</option>
                        <option value="admin">Administrador</option>
                        <option value="medico">Médico</option>
                        <option value="atendente">Atendente</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label>Email:</label>
                    <input type="email" id="email" placeholder="Informe o email..." />
                </div>
                <div class="form-group" style="flex: 1.5;">
                    <label>Senha:</label>
                    <input type="password" id="senha" placeholder="Informe a senha..." />
                </div>
                <div class="form-group">
                    <label>Status:</label>
                    <select id="status">
                        <option value="">---</option>
                        <option value="ativo">Ativo</option>
                        <option value="inativo">Inativo</option>
                    </select>
                </div>
            </div>

            <div class="form-footer">
                <button class="btn btn-enviar" onclick="cadastrarUsuario()">Enviar</button>
                <button class="btn btn-cancelar" onclick="window.location.href='home.html'">Cancelar</button>
            </div>

        </div>
    </div>

    <script>
        function cadastrarUsuario() {
            const nome = document.getElementById('nome').value.trim();

            if (!nome) {
                alert('Por favor, informe o nome do usuário.');
                return;
            }

            alert('Cadastro de usuário efetuado com sucesso');

            // Limpar campos após OK
            document.getElementById('nome').value = '';
            document.getElementById('cpf').value = '';
            document.getElementById('endereco').value = '';
            document.getElementById('nivel').value = '';
            document.getElementById('email').value = '';
            document.getElementById('senha').value = '';
            document.getElementById('status').value = '';
        }
    </script>
</body>
</html>
